name: Build Tenant APK (Unsigned & Harvest)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "distr build id"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build unsigned tenant bundle
        run: |
          # Build the AAB bundle instead of the APK. 
          # No keystore is used here.
          ./gradlew :app:bundleTenantRelease
          
          # Find the generated .aab file
          find . -name "*.aab" -path "*tenantRelease*" -exec cp {} unsigned.aab \;
          [[ -f unsigned.aab ]] || { echo "::error::Failed to find unsigned.aab"; exit 1; }

      - name: Calculate bundle SHA-256
        id: sha
        run: echo "sha256=$(sha256sum unsigned.aab | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Upload unsigned bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenant-bundle
          path: unsigned.aab

      - name: Trigger Zealot Storage harvest workflow
        env:
          GH_TOKEN: ${{ secrets.ZEALOT_STORAGE_PAT }}
        run: |
          gh api repos/Zapier-codes/zealot-storage/dispatches \
            -f event_type=harvest-tenant-apk \
            -f client_payload[build_id]="${{ inputs.build_id }}" \
            -f client_payload[storeapp_run_id]="${{ github.run_id }}" \
            -f client_payload[bundle_sha256]="${{ steps.sha.outputs.sha256 }}"
