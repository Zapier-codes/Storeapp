# The store app's own version, MAJOR.MINOR. Edit this by hand to start a new minor or major line.
# CI adds the PATCH (the number of commits since this file last changed) and the versionCode
# (commit count + VERSION_CODE_OFFSET), so the same commit always gets the same version.
# See docs/RELEASING.md. 1.1 is deliberate: the inherited upstream tags stop at v1.0.7.
major_minor=1.1
